<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header1">
        <img class="logo" src="dmmmsu-logo.png" alt="DMMMSU logo" />
        <h2>DON MARIANO MARCOS MEMORIAL STATE UNIVERSITY</h2>
      </div>

      <div class="header2">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact Us</a>
      </div>

      <div class="menu">
        <h2>Gallery</h2>
        <img class="pic1" src="pic1.jpg" alt="Picture 1" />
        <img class="pic2" src="pic2.jpg" alt="Picture 2" />
        <img class="pic3" src="pic3.jpg" alt="Picture 3" />
        <div class="pictures"></div>
      </div>

      <div class="content">
        <div class="form">
          <label for="name">Title</label>
          <input type="text" id="name" />

          <label for="msg">Message</label>
          <textarea id="msg"></textarea>

          <button type="button">Post Notice</button>
        </div>
      </div>

      <div class="footer"><h4>COLLEGE OF COMPUTER SCIENCE</h4></div>
    </div>
  </body>
</html>
